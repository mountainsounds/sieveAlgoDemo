<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Set the theme before first paint. Kept inline so there is no flash.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('algo-theme');
        } catch (e) {
          /* storage unavailable */
        }
        if (theme !== 'signal' && theme !== 'notebook') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'notebook'
              : 'signal';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta
      name="description"
      content="Animated algorithm walkthroughs. 01: Sieve of Eratosthenes. 02: Binary Search."
    />
    <meta name="theme-color" content="#0a0c10" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Sieve of Eratosthenes · algo.</title>
  </head>
  <body>
    <header class="top-bar">
      <a class="wordmark" href="./">algo<span class="wordmark-dot">.</span></a>
      <div class="top-actions">
        <div class="algo-picker" id="algoPicker">
          <button
            type="button"
            class="picker-btn"
            id="pickerBtn"
            role="combobox"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="pickerList"
            aria-label="Algorithm"
          >
            <span id="pickerValue">01 · Sieve of Eratosthenes</span>
            <svg class="picker-chevron" viewBox="0 0 10 6" aria-hidden="true">
              <path d="M1 1l4 4 4-4" />
            </svg>
          </button>
          <ul class="picker-list" id="pickerList" role="listbox" aria-label="Algorithm" hidden></ul>
        </div>
        <fieldset class="theme-switch">
          <legend class="visually-hidden">Theme</legend>
          <label class="switch-opt">
            <input type="radio" name="theme" value="signal" />
            <span>Signal</span>
          </label>
          <label class="switch-opt">
            <input type="radio" name="theme" value="notebook" />
            <span>Notebook</span>
          </label>
        </fieldset>
      </div>
    </header>

    <main class="page">
      <section class="algo-head">
        <p class="eyebrow" id="algoIndex">algorithm 01</p>
        <h1 id="algoTitle">Sieve of Eratosthenes</h1>
        <p class="summary" id="algoSummary">
          Counts the primes below n by striking out the multiples of each prime.
        </p>
        <nav class="refs" id="algoRefs" aria-label="References">
          <a
            href="https://en.wikipedia.org/wiki/Sieve_of_Eratosthenes"
            target="_blank"
            rel="noreferrer"
            >Wikipedia</a
          >
          <a
            href="https://en.wikipedia.org/wiki/Sieve_of_Eratosthenes#Algorithmic_complexity"
            target="_blank"
            rel="noreferrer"
            >O(n log log n)</a
          >
          <a href="https://leetcode.com/problems/count-primes/" target="_blank" rel="noreferrer"
            >LeetCode 204</a
          >
        </nav>
      </section>

      <div class="layout">
        <section class="code-pane" aria-label="Code">
          <div class="panel code-panel">
            <p class="panel-label" id="codeLabel">countPrimes.js</p>
            <pre class="code-pre"><code id="codeBlock"></code></pre>
          </div>
        </section>

        <section class="viz-pane" aria-label="Visualization">
          <form class="panel controls" id="controls">
            <div class="control-fields" id="controlFields">
              <div class="field">
                <label class="panel-label" for="ctl-n">n (2–120)</label>
                <input
                  id="ctl-n"
                  name="n"
                  type="number"
                  inputmode="numeric"
                  min="2"
                  max="120"
                  step="1"
                  value="30"
                />
              </div>
            </div>
            <div class="buttons">
              <button type="submit" id="runBtn" class="btn primary">Run</button>
              <button type="button" id="stepBtn" class="btn">Step</button>
              <button type="button" id="resetBtn" class="btn">Reset</button>
            </div>
            <label class="speed">
              <span class="panel-label">Speed</span>
              <select id="speedSelect">
                <option value="0.5">0.5×</option>
                <option value="1" selected>1×</option>
                <option value="2">2×</option>
                <option value="4">4×</option>
              </select>
            </label>
          </form>

          <div id="stage" aria-hidden="true"></div>

          <div class="readout">
            <p class="status" id="status" role="status" aria-live="polite">Pick n and press Run.</p>
            <!-- Repeats what the status line announces; hidden from AT. -->
            <span id="countChip" class="count-chip" aria-hidden="true" hidden></span>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <p>
        Zack Sawyer ·
        <a href="https://github.com/mountainsounds/sieveAlgoDemo" target="_blank" rel="noreferrer"
          >Source</a
        >
        ·
        <a href="https://mtnsounds.com" target="_blank" rel="noreferrer">mtnsounds.com</a>
      </p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
